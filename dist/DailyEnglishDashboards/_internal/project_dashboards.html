<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily English | Project Dashboards</title><style>
:root{--ink:#17202a;--muted:#687582;--line:#dce3e8;--canvas:#f4f6f8;--blue:#1769aa;--red:#c44747;--amber:#c47d16;--green:#248a5b}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px Georgia,serif}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:28px}.brand{font-weight:700;font-size:19px}.brand span{color:var(--blue)}.nav{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue);padding:23px 0 20px}.app{min-height:100vh}main{max-width:1600px;margin:auto;padding:30px 32px}.heading{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.eyebrow{font:700 11px Arial,sans-serif;color:var(--blue);letter-spacing:1.5px;text-transform:uppercase;margin:0 0 8px}.heading h1{font-size:32px;margin:0 0 5px}.heading p{color:var(--muted);margin:0}.new{background:var(--blue);color:#fff;border:0;border-radius:4px;padding:11px 16px;font-weight:700}.workspace{display:grid;grid-template-columns:260px 1fr;gap:18px}.banks{display:grid;gap:8px}.bank{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bank-color);border-radius:4px;text-align:left;padding:14px;color:var(--ink)}.bank.selected{box-shadow:0 2px 8px #17202a16;border-color:var(--bank-color)}.bank strong{display:block;margin-bottom:5px}.bank small{color:var(--muted);font:11px Arial,sans-serif}.toolbar{display:flex;gap:10px;margin-bottom:18px}.search,.filter{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px}.search{width:280px}.summary{margin-left:auto;color:var(--muted);align-self:center;font-size:13px}.board{display:grid;grid-template-columns:repeat(4,minmax(190px,1fr));gap:14px}.column{background:#e9edf0;border:1px solid var(--line);border-radius:5px;min-height:450px;padding:12px}.column header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.column header div{display:flex;align-items:center;gap:8px}.column h2{font:bold 14px Arial,sans-serif;margin:0}.dot{width:9px;height:9px;border-radius:50%;background:#687582}.dot-in-progress{background:var(--blue)}.dot-review{background:var(--amber)}.dot-done{background:var(--green)}.count{color:var(--muted);font:12px Arial,sans-serif}.cards{display:grid;gap:10px;min-height:70px}.cards.drop-target{background:#dcebf4;outline:2px dashed var(--blue);outline-offset:3px}.card{background:#fff;border:1px solid #e1e6ea;border-radius:4px;padding:13px;cursor:grab;box-shadow:0 1px 2px #17202a0b}.card.dragging{opacity:.45}.card-top{display:flex;justify-content:space-between;align-items:center}.task-id{color:var(--muted);font:700 10px Arial,sans-serif}.priority{font:700 10px Arial,sans-serif;letter-spacing:.5px}.priority-high{color:var(--red)}.priority-medium{color:var(--amber)}.priority-low{color:var(--green)}.card h3{font-size:16px;line-height:1.25;margin:10px 0 8px}.card p{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 14px}.card footer{display:flex;align-items:center;gap:7px;color:var(--muted);font:12px Arial,sans-serif}.avatar{display:grid;place-items:center;border-radius:50%;height:24px;width:24px;background:#dcebf4;color:var(--blue);font-weight:700}.tag{margin-left:auto;border:1px solid var(--line);border-radius:3px;padding:3px 6px;font-size:10px}.edit{margin-left:auto;border:0;background:transparent;color:var(--muted)}.modal{position:fixed;inset:0;background:#17202a66;display:none;place-items:center;padding:20px}.modal.open{display:grid}.form{background:#fff;border-radius:6px;padding:24px;width:min(560px,100%);display:grid;gap:13px}.form-head{display:flex;justify-content:space-between}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.form label{display:grid;gap:5px;color:var(--muted);font:700 11px Arial,sans-serif}.form input,.form textarea,.form select{border:1px solid var(--line);border-radius:4px;padding:10px;color:var(--ink);background:#fff}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{border:1px solid #d7a4a4;background:#fff;color:var(--red);border-radius:4px;padding:10px;font-weight:700}@media(max-width:1050px){.workspace{grid-template-columns:1fr}.banks{grid-template-columns:repeat(3,1fr)}.board{grid-template-columns:repeat(2,minmax(220px,1fr))}}@media(max-width:620px){main{padding:22px 16px}.topbar{padding:0 16px}.banks,.board{grid-template-columns:1fr}.heading{align-items:start;flex-direction:column}.toolbar{flex-wrap:wrap}.search{width:100%}.summary{margin-left:0}.form-grid{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="topbar"><div class="brand">Daily <span>English</span></div><div class="nav">Project dashboards</div></header><main><section class="heading"><div><p class="eyebrow">Client delivery / Choose a workspace</p><h1 id="title">Project dashboard</h1><p id="subtitle"></p></div><button class="new" id="new-task">+ New task</button></section><div class="workspace"><aside class="banks" id="banks"></aside><section><div class="toolbar"><input class="search" id="search" placeholder="Search tasks..." aria-label="Search tasks"><select class="filter" id="assignee" aria-label="Filter by assignee"><option value="">All assignees</option></select><select class="filter" id="priority" aria-label="Filter by priority"><option value="">All priorities</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select><span class="summary" id="summary"></span></div><div class="board" id="board"></div></section></div></main><div class="modal" id="modal"><form class="form" id="task-form"><div class="form-head"><h2 id="form-title">New task</h2><button class="close" type="button" id="close">&times;</button></div><label>Title<input id="task-title" required></label><label>Description<textarea id="task-description" rows="4"></textarea></label><div class="form-grid"><label>Assignee<input id="task-assignee"></label><label>Priority<select id="task-priority"><option>HIGH</option><option selected>MEDIUM</option><option>LOW</option></select></label><label>Status<select id="task-status"><option>Todo</option><option>In Progress</option><option>Review</option><option>Done</option></select></label></div><button class="new" type="submit">Save task</button><button class="danger" type="button" id="delete">Delete task</button></form></div></div><script>
const banks=[{"id": "aurora-retail", "name": "Aurora Retail Group", "industry": "Retail & Commerce", "description": "Sales, inventory and margin analytics delivery.", "color": "#b15b24", "tasks": [{"title": "Define project KPIs", "description": "PM and analysts define KPIs for sales, inventory and margin.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request access to POS API", "description": "Data Engineer requests credentials and tests connectivity.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Document data sources", "description": "List POS, ERP and inventory systems with fields and update frequency.", "assignee": "marcos", "priority": "MEDIUM", "status": "Todo"}, {"title": "Build ingestion pipeline for daily sales", "description": "Create ingestion pipeline from POS API with retries and logging.", "assignee": "marcos", "priority": "HIGH", "status": "In Progress"}, {"title": "Clean and transform inventory data", "description": "Standardize product IDs, remove nulls and unify stock tables.", "assignee": "diego", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Create Power BI semantic model", "description": "Build model with fact_sales, dim_product and dim_store.", "assignee": "laura", "priority": "HIGH", "status": "In Progress"}, {"title": "Draft dashboard layout", "description": "Create initial layout for sales and inventory dashboard.", "assignee": "ana", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Validate DAX measures", "description": "Check Sales, Margin, Out-of-Stock and Returns measures.", "assignee": "ana", "priority": "HIGH", "status": "Review"}, {"title": "Review pipeline performance", "description": "Test ingestion pipeline duration and resource usage.", "assignee": "marcos", "priority": "MEDIUM", "status": "Review"}, {"title": "Review dashboard layout with PM", "description": "PM validates structure, navigation and visual hierarchy.", "assignee": "ana", "priority": "LOW", "status": "Review"}, {"title": "Project kickoff meeting", "description": "PM and team align scope, roles and timelines.", "assignee": "diego", "priority": "LOW", "status": "Done"}, {"title": "Create repository structure", "description": "Initialize folders for pipelines, models and documentation.", "assignee": "marcos", "priority": "LOW", "status": "Done"}]}, {"id": "medicare-network", "name": "MedicaCare Network", "industry": "Healthcare", "description": "Patient portal and digital scheduling implementation.", "color": "#248a5b", "tasks": [{"title": "Confirm patient portal KPIs", "description": "Agree activation, appointment and support KPIs with clinical operations.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request scheduling API access", "description": "Obtain sandbox credentials and validate appointment endpoints.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Document clinic workflows", "description": "Map booking, cancellation and follow-up workflows by clinic.", "assignee": "marcos", "priority": "MEDIUM", "status": "Todo"}, {"title": "Build appointment ingestion", "description": "Load appointments and cancellations with audit logging.", "assignee": "marcos", "priority": "HIGH", "status": "In Progress"}, {"title": "Normalize patient identifiers", "description": "Standardize patient and clinic identifiers across source systems.", "assignee": "diego", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Create portal semantic model", "description": "Model patients, clinics, appointments and portal activity.", "assignee": "laura", "priority": "HIGH", "status": "In Progress"}, {"title": "Draft clinical dashboard", "description": "Create a clear view for access, bookings and unresolved issues.", "assignee": "ana", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Validate appointment measures", "description": "Check booking, cancellation, no-show and activation measures.", "assignee": "ana", "priority": "HIGH", "status": "Review"}, {"title": "Review integration latency", "description": "Test data freshness and alerting for delayed appointment feeds.", "assignee": "marcos", "priority": "MEDIUM", "status": "Review"}, {"title": "Review dashboard with operations", "description": "Clinical operations validates navigation and privacy-safe summaries.", "assignee": "ana", "priority": "LOW", "status": "Review"}, {"title": "Approve project scope", "description": "Client and delivery team align scope, roles and launch milestones.", "assignee": "diego", "priority": "LOW", "status": "Done"}, {"title": "Create secure repository structure", "description": "Initialize folders for pipelines, models, tests and documentation.", "assignee": "marcos", "priority": "LOW", "status": "Done"}]}, {"id": "pulsepay", "name": "PulsePay", "industry": "Finance & Fintech", "description": "Fraud detection and payment reliability program.", "color": "#1769aa", "tasks": [{"title": "Define fraud monitoring KPIs", "description": "Agree false positives, detection rate and investigation time targets.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request payment event access", "description": "Obtain credentials and validate transaction event connectivity.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Document risk data sources", "description": "List payment, merchant and investigation sources with refresh rules.", "assignee": "marcos", "priority": "MEDIUM", "status": "Todo"}, {"title": "Build transaction ingestion pipeline", "description": "Ingest payment events with retries, masking and audit logs.", "assignee": "marcos", "priority": "HIGH", "status": "In Progress"}, {"title": "Clean merchant risk data", "description": "Normalize merchant IDs, categories and missing risk attributes.", "assignee": "diego", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Create fraud semantic model", "description": "Build model with transactions, merchants, alerts and investigations.", "assignee": "laura", "priority": "HIGH", "status": "In Progress"}, {"title": "Draft risk dashboard layout", "description": "Create views for alerts, trends, investigations and payment health.", "assignee": "ana", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Validate fraud measures", "description": "Check detection rate, false positives, exposure and recovery measures.", "assignee": "ana", "priority": "HIGH", "status": "Review"}, {"title": "Review alert pipeline performance", "description": "Test event duration, throughput and resource usage under peak load.", "assignee": "marcos", "priority": "MEDIUM", "status": "Review"}, {"title": "Review risk dashboard with compliance", "description": "Compliance validates structure, access rules and visual hierarchy.", "assignee": "ana", "priority": "LOW", "status": "Review"}, {"title": "Risk program kickoff", "description": "Client and delivery team align scope, controls and timelines.", "assignee": "diego", "priority": "LOW", "status": "Done"}, {"title": "Create controlled repository structure", "description": "Initialize folders for pipelines, models, controls and documentation.", "assignee": "marcos", "priority": "LOW", "status": "Done"}]}, {"id": "swiftlogistics", "name": "SwiftRoute Logistics", "industry": "Logistics & Transport", "description": "Route optimization, warehouse visibility and delivery performance.", "color": "#7157a8", "tasks": [{"title": "Define delivery KPIs", "description": "Agree on on-time delivery, failed attempt and cost-per-route measures.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Connect warehouse scan feed", "description": "Request credentials and test inbound and outbound scan events.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Map depot master data", "description": "Document depots, routes, vehicles and carrier relationships.", "assignee": "marcos", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Review route dashboard", "description": "Operations validates exception views and daily delivery summaries.", "assignee": "ana", "priority": "MEDIUM", "status": "Review"}]}, {"id": "solaris-energy", "name": "Solaris Energy", "industry": "Energy & Utilities", "description": "Energy production monitoring and asset maintenance delivery.", "color": "#c47d16", "tasks": [{"title": "Define production KPIs", "description": "Align generation, availability and curtailment measures with operations.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request meter data access", "description": "Validate secure access to plant meters and interval readings.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Build asset ingestion pipeline", "description": "Load generation and maintenance data with quality checks.", "assignee": "marcos", "priority": "HIGH", "status": "In Progress"}, {"title": "Validate outage measures", "description": "Engineering reviews outage duration, availability and maintenance calculations.", "assignee": "ana", "priority": "MEDIUM", "status": "Review"}]}, {"id": "connecta-telecom", "name": "Connecta Telecom", "industry": "Telecommunications", "description": "Network quality, customer experience and service operations.", "color": "#1769aa", "tasks": [{"title": "Define network quality KPIs", "description": "Agree latency, availability, dropped-call and complaint measures.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request network events access", "description": "Obtain credentials and validate network event stream connectivity.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Standardize cell identifiers", "description": "Unify region, tower and cell identifiers across operational systems.", "assignee": "marcos", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Review service dashboard", "description": "Customer operations validates outage and service-quality navigation.", "assignee": "ana", "priority": "LOW", "status": "Done"}]}, {"id": "northstar-media", "name": "Northstar Media", "industry": "Media & Entertainment", "description": "Audience analytics, content performance and subscription growth.", "color": "#8b4f9f", "tasks": [{"title": "Define audience KPIs", "description": "Align reach, engagement, retention and subscription measures.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Connect streaming events", "description": "Test access to playback, search and subscription event data.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Create content semantic model", "description": "Model shows, episodes, audiences, platforms and subscription events.", "assignee": "marcos", "priority": "HIGH", "status": "In Progress"}, {"title": "Review editorial dashboard", "description": "Editorial team validates content performance views and drill-throughs.", "assignee": "ana", "priority": "MEDIUM", "status": "Review"}]}, {"id": "buildwise", "name": "BuildWise Construction", "industry": "Construction & Real Estate", "description": "Project costs, site progress and subcontractor performance.", "color": "#b15b24", "tasks": [{"title": "Define project controls KPIs", "description": "Agree cost variance, schedule variance and safety measures.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request site system access", "description": "Validate access to project, procurement and timesheet systems.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Map subcontractor data", "description": "Document contractors, packages, milestones and payment status.", "assignee": "marcos", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Review project controls dashboard", "description": "Project managers validate cost and schedule exception views.", "assignee": "ana", "priority": "MEDIUM", "status": "Review"}]}, {"id": "civic-services", "name": "Civic Services Authority", "industry": "Public Sector", "description": "Citizen services, case management and operational transparency.", "color": "#248a5b", "tasks": [{"title": "Define citizen service KPIs", "description": "Agree resolution time, backlog, satisfaction and accessibility measures.", "assignee": "laura", "priority": "HIGH", "status": "Todo"}, {"title": "Request case management access", "description": "Obtain approved access and validate privacy controls.", "assignee": "diego", "priority": "HIGH", "status": "Todo"}, {"title": "Clean service request data", "description": "Standardize categories, channels, regions and case statuses.", "assignee": "marcos", "priority": "MEDIUM", "status": "In Progress"}, {"title": "Review transparency dashboard", "description": "Service owners validate public-safe summaries and navigation.", "assignee": "ana", "priority": "LOW", "status": "Done"}]}],statuses=['Todo','In Progress','Review','Done'],storageKey='daily-english-dashboard-v2';let selected=banks[0].id,editingId=null;const banksEl=document.querySelector('#banks'),board=document.querySelector('#board'),modal=document.querySelector('#modal'),form=document.querySelector('#task-form'),search=document.querySelector('#search'),assignee=document.querySelector('#assignee'),priority=document.querySelector('#priority'),summary=document.querySelector('#summary');const esc=value=>String(value??'');function bank(){return banks.find(item=>item.id===selected)}function normalizeTasks(current){const tasks=current.tasks.map((task,index)=>({...task,id:task.id||`TASK-${String(index+1).padStart(3,'0')}`}));const extras=[['Define reporting scope','Agree the reporting scope and acceptance criteria with the client.','MEDIUM','Todo'],['Request source credentials','Request secure access to the remaining source systems.','MEDIUM','Todo'],['Document business rules','Capture definitions, ownership and refresh expectations.','LOW','Todo'],['Build data quality checks','Add completeness, freshness and duplicate-record checks.','MEDIUM','In Progress'],['Create executive summary','Prepare the executive view for the client steering meeting.','MEDIUM','In Progress'],['Run stakeholder review','Review the first results with client stakeholders.','LOW','Review'],['Publish delivery notes','Document assumptions, decisions and known limitations.','LOW','Review'],['Plan next sprint','Agree priorities, owners and dates for the next sprint.','LOW','Done']];extras.slice(0,Math.max(0,12-tasks.length)).forEach(item=>tasks.push({id:`TASK-${String(tasks.length+1).padStart(3,'0')}`,title:item[0],description:`${item[1]} Project context: ${current.industry}.`,priority:item[2],status:item[3]}));const people=['ana','diego','laura','marcos'];people.sort(()=>Math.random()-.5);tasks.forEach((task,index)=>task.assignee=people[index%people.length]);return tasks}function getTasks(){const saved=JSON.parse(localStorage.getItem(`${storageKey}-${selected}`)||'null');if(saved)return saved;const tasks=normalizeTasks(bank());save(tasks);return tasks}function save(tasks){localStorage.setItem(`${storageKey}-${selected}`,JSON.stringify(tasks))}function renderBanks(){banksEl.innerHTML=banks.map(item=>`<button class="bank ${item.id===selected?'selected':''}" style="--bank-color:${item.color}" data-id="${item.id}"><strong>${item.name}</strong><small>${item.industry} · 12 tasks</small></button>`).join('');banksEl.querySelectorAll('.bank').forEach(el=>el.addEventListener('click',()=>{selected=el.dataset.id;search.value='';assignee.value='';priority.value='';render()}))}function card(task){return `<article class="card" draggable="true" data-id="${task.id}" data-status="${task.status}" data-search="${esc(task.title+' '+task.description+' '+(task.assignee||'')).toLowerCase()}"><div class="card-top"><span class="task-id">${task.id}</span><span class="priority priority-${task.priority.toLowerCase()}">${task.priority}</span></div><h3>${task.title}</h3><p>${task.description}</p><footer><span class="avatar">${(task.assignee||'U')[0].toUpperCase()}</span><span>${task.assignee||'Unassigned'}</span><button class="edit" aria-label="Edit task">Edit</button></footer></article>`}function render(){const current=bank(),tasks=getTasks(),q=search.value.toLowerCase(),a=assignee.value,p=priority.value;document.querySelector('#title').textContent=current.name;document.querySelector('#subtitle').textContent=`${current.industry} · ${current.description}`;renderBanks();assignee.innerHTML='<option value="">All assignees</option>'+[...new Set(tasks.map(t=>t.assignee).filter(Boolean))].sort().map(name=>`<option>${name}</option>`).join('');assignee.value=a;board.innerHTML=statuses.map(status=>`<section class="column" data-status="${status}"><header><div><span class="dot dot-${status.toLowerCase().replace(' ','-')}"></span><h2>${status}</h2></div><span class="count">${tasks.filter(t=>t.status===status).length}</span></header><div class="cards">${tasks.filter(t=>t.status===status&&(!q||t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q)||String(t.assignee||'').toLowerCase().includes(q))&&(!a||t.assignee===a)&&(!p||t.priority===p)).map(card).join('')}</div></section>`).join('');summary.textContent=`${document.querySelectorAll('.card').length} of ${tasks.length} tasks visible`;bind();bindDrop()}function bind(){document.querySelectorAll('.card').forEach(el=>{el.addEventListener('click',event=>{if(event.target.closest('.edit')){openForm(el.dataset.id);return}openForm(el.dataset.id)});el.addEventListener('dragstart',event=>{event.dataTransfer.setData('text/plain',el.dataset.id);el.classList.add('dragging')});el.addEventListener('dragend',()=>el.classList.remove('dragging'))})}function bindDrop(){document.querySelectorAll('.cards').forEach(zone=>{zone.addEventListener('dragover',event=>{event.preventDefault();zone.classList.add('drop-target')});zone.addEventListener('dragleave',()=>zone.classList.remove('drop-target'));zone.addEventListener('drop',event=>{event.preventDefault();const tasks=getTasks(),task=tasks.find(item=>item.id===event.dataTransfer.getData('text/plain'));if(task){task.status=zone.closest('.column').dataset.status;save(tasks);render()}})})}function openForm(id){editingId=id;const task=getTasks().find(item=>item.id===id);document.querySelector('#form-title').textContent=id?'Edit task':'New task';document.querySelector('#task-title').value=task?.title||'';document.querySelector('#task-description').value=task?.description||'';document.querySelector('#task-assignee').value=task?.assignee||'';document.querySelector('#task-priority').value=task?.priority||'MEDIUM';document.querySelector('#task-status').value=task?.status||'Todo';document.querySelector('#delete').style.display=id?'block':'none';modal.classList.add('open')}document.querySelector('#new-task').addEventListener('click',()=>openForm(''));document.querySelector('#close').addEventListener('click',()=>modal.classList.remove('open'));form.addEventListener('submit',event=>{event.preventDefault();const tasks=getTasks(),task={id:editingId||`TASK-${Date.now()}`,title:document.querySelector('#task-title').value.trim(),description:document.querySelector('#task-description').value.trim(),assignee:document.querySelector('#task-assignee').value.trim(),priority:document.querySelector('#task-priority').value,status:document.querySelector('#task-status').value};const index=tasks.findIndex(item=>item.id===editingId);if(index>=0)tasks[index]=task;else tasks.push(task);save(tasks);modal.classList.remove('open');render()});document.querySelector('#delete').addEventListener('click',()=>{if(!editingId||!confirm('Delete this task?'))return;save(getTasks().filter(item=>item.id!==editingId));modal.classList.remove('open');render()});[search,assignee,priority].forEach(el=>el.addEventListener('input',render));render();
</script></body></html>

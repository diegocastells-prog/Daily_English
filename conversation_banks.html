<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily English | Daily Meeting Banks</title><style>
:root{--ink:#17202a;--muted:#687582;--line:#dce3e8;--canvas:#f4f6f8;--white:#fff;--blue:#1769aa;--navy:#172c3d}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font:14px Georgia,serif}button,input,select{font:inherit}button{cursor:pointer}.app{min-height:100vh}.topbar{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 32px;gap:28px}.brand{font:700 19px Georgia,serif}.brand span{color:var(--blue)}.nav{display:flex;gap:22px;color:var(--muted)}.nav .active{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue);padding:23px 0 20px}main{max-width:1500px;margin:auto;padding:32px}.intro{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:28px}.eyebrow{font:700 11px Arial,sans-serif;color:var(--blue);letter-spacing:1.6px;text-transform:uppercase;margin:0 0 8px}h1{font-size:34px;margin:0 0 6px}.intro p:last-child{color:var(--muted);margin:0;max-width:600px}.stats{display:flex;gap:24px;text-align:right}.stat strong{display:block;font-size:25px;color:var(--navy)}.stat span{color:var(--muted);font:11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.8px}.toolbar{display:flex;gap:10px;margin-bottom:22px;align-items:center}.search,.filter{background:#fff;border:1px solid var(--line);border-radius:4px;padding:10px 12px;color:var(--ink)}.search{width:310px}.summary{margin-left:auto;color:var(--muted);font-size:13px}.layout{display:grid;grid-template-columns:280px 1fr;gap:22px;align-items:start}.bank-list{display:grid;gap:8px}.bank{background:#fff;border:1px solid var(--line);border-left:4px solid var(--bank-color);border-radius:4px;padding:14px;text-align:left;color:var(--ink)}.bank:hover,.bank.selected{border-color:var(--bank-color);box-shadow:0 2px 8px #17202a12}.bank.selected{background:#fbfcfd}.bank-name{font-weight:700;display:block;margin-bottom:5px}.bank-meta{color:var(--muted);font:11px Arial,sans-serif}.library{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:14px}.conversation{background:#fff;border:1px solid var(--line);border-radius:5px;padding:17px;text-align:left;min-height:178px;display:flex;flex-direction:column}.conversation:hover{border-color:var(--blue);box-shadow:0 3px 12px #17202a12}.conversation-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.conversation h2{font-size:19px;line-height:1.2;margin:12px 0 8px}.conversation p{color:var(--muted);line-height:1.4;margin:0 0 16px}.level{color:var(--bank-color);font:700 11px Arial,sans-serif}.duration{color:var(--muted);font:11px Arial,sans-serif}.goal{margin-top:auto;font:12px Arial,sans-serif;color:var(--navy)}.detail-backdrop{position:fixed;inset:0;background:#17202a66;display:none;place-items:center;padding:20px}.detail-backdrop.open{display:grid}.detail{background:#fff;border-radius:6px;max-width:680px;width:100%;max-height:90vh;overflow:auto;padding:26px;box-shadow:0 12px 40px #17202a33}.detail-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.close{border:0;background:transparent;color:var(--muted);font-size:22px}.detail h2{font-size:28px;margin:12px 0 8px}.detail-subtitle{color:var(--muted);margin:0 0 22px}.turns{display:grid;gap:10px}.turn{padding:12px 14px;border-left:3px solid var(--turn-color);background:#f7f9fa;border-radius:0 4px 4px 0}.speaker{display:block;color:var(--turn-color);font:700 11px Arial,sans-serif;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}.turn-text{line-height:1.45}@media(max-width:900px){main{padding:22px 16px}.layout{grid-template-columns:1fr}.bank-list{grid-template-columns:repeat(3,1fr)}.intro{display:block}.stats{margin-top:20px;text-align:left}}@media(max-width:620px){.topbar{padding:0 16px}.nav{display:none}.toolbar{flex-wrap:wrap}.search{width:100%}.summary{margin-left:0}.bank-list,.library{grid-template-columns:1fr}}
</style></head><body><div class="app"><header class="topbar"><div class="brand">Daily <span>English</span></div><nav class="nav"><span>Boards</span><span class="active">Daily meetings</span></nav></header><main><section class="intro"><div><p class="eyebrow">Practice library / Client delivery</p><h1>Daily meeting banks</h1><p>Choose a sector, join a client meeting and practise reporting progress, blockers and next steps.</p></div><div class="stats"><div class="stat"><strong id="bank-count"></strong><span>Companies</span></div><div class="stat"><strong id="conversation-count"></strong><span>Daily meetings</span></div></div></section><div class="toolbar"><input class="search" id="search" type="search" placeholder="Search daily meetings..." aria-label="Search daily meetings"><select class="filter" id="level" aria-label="Filter by level"><option value="">All levels</option><option>A2</option><option>B1</option><option>B2</option><option>C1</option></select><span class="summary" id="summary"></span></div><div class="layout"><aside class="bank-list" id="bank-list"></aside><section class="library" id="library"></section></div></main><div class="detail-backdrop" id="detail-backdrop" role="dialog" aria-modal="true"><section class="detail"><div class="detail-head"><span class="eyebrow" id="detail-bank"></span><button class="close" id="detail-close" aria-label="Close daily meeting">&times;</button></div><h2 id="detail-title"></h2><p class="detail-subtitle" id="detail-context"></p><p class="detail-subtitle" id="detail-goal"></p><div class="turns" id="turns"></div></section></div></div><script>
const banks=[{"id": "retail-aurora", "name": "Aurora Retail Group", "industry": "Retail & Commerce", "color": "#b15b24", "description": "Daily meetings for Aurora's sales, inventory and data platform project.", "conversations": [{"title": "Sales dashboard integration", "client": "Aurora Retail Group", "provider": "Northstar Data", "project": "Retail analytics platform", "level": "B1", "duration": "10 min", "goal": "Report yesterday's progress, a data issue and today's action.", "turns": [{"speaker": "Laura - Aurora", "text": "Yesterday I validated the sales definitions with the finance team. Today I will confirm the margin rules."}, {"speaker": "Diego - Northstar Data", "text": "I connected the POS feed, but store 18 is sending duplicate transactions. I am checking the source mapping this morning."}, {"speaker": "Marcos - Northstar Data", "text": "I can review the duplicate records with you after this meeting."}, {"speaker": "Laura - Aurora", "text": "Perfect. The only blocker is the margin rule. I will send an answer before lunch."}]}, {"title": "Inventory alert pilot", "client": "Aurora Retail Group", "provider": "Northstar Data", "project": "Stock-out prevention", "level": "B2", "duration": "12 min", "goal": "Coordinate a pilot, identify a dependency and agree on ownership.", "turns": [{"speaker": "Ana - Aurora", "text": "The pilot alert worked for three stores yesterday, but the threshold is too sensitive for seasonal products."}, {"speaker": "Marcos - Northstar Data", "text": "I can add a category-level threshold. I need the product grouping from your merchandising team."}, {"speaker": "Ana - Aurora", "text": "I will request that file today. Can the pilot continue with the current threshold?"}, {"speaker": "Marcos - Northstar Data", "text": "Yes, as long as we label the alerts as experimental in the dashboard."}]}, {"title": "Release readiness check", "client": "Aurora Retail Group", "provider": "Northstar Data", "project": "Retail analytics platform", "level": "C1", "duration": "15 min", "goal": "Discuss delivery risk and make a clear release recommendation.", "turns": [{"speaker": "Project lead - Aurora", "text": "The release candidate is stable, but the returns metric still differs from the finance report."}, {"speaker": "Diego - Northstar Data", "text": "The difference comes from late returns. We can document the timing rule and include a reconciliation view."}, {"speaker": "Project lead - Aurora", "text": "Would that be sufficient for a controlled release on Friday?"}, {"speaker": "Diego - Northstar Data", "text": "Yes, provided finance signs off on the reconciliation view by tomorrow afternoon."}]}]}, {"id": "healthcare-medica", "name": "MedicaCare Network", "industry": "Healthcare", "color": "#248a5b", "description": "Daily meetings for a healthcare scheduling and patient portal rollout.", "conversations": [{"title": "Patient portal access", "client": "MedicaCare Network", "provider": "ClearPath Digital", "project": "Patient portal rollout", "level": "B1", "duration": "10 min", "goal": "Give a concise update and clarify an access dependency.", "turns": [{"speaker": "Nurse lead - MedicaCare", "text": "Yesterday we tested registration with five patients. Two did not receive the verification email."}, {"speaker": "Product analyst - ClearPath", "text": "I will check the email service logs. Are those patients using the same provider?"}, {"speaker": "Nurse lead - MedicaCare", "text": "Yes, both use the hospital email domain."}, {"speaker": "Product analyst - ClearPath", "text": "That points to a domain configuration issue. I will raise it with infrastructure today."}]}, {"title": "Appointment API mapping", "client": "MedicaCare Network", "provider": "ClearPath Digital", "project": "Digital scheduling", "level": "B2", "duration": "12 min", "goal": "Explain a technical blocker in business language and assign next steps.", "turns": [{"speaker": "Integration lead - ClearPath", "text": "The appointment API is connected, but cancellations do not include the clinic code."}, {"speaker": "Operations manager - MedicaCare", "text": "That code is required for reporting. Can we derive it from the doctor identifier?"}, {"speaker": "Integration lead - ClearPath", "text": "Only for most clinics. We need the official mapping to avoid incorrect cancellations."}, {"speaker": "Operations manager - MedicaCare", "text": "I will ask the scheduling team for the mapping and send it before the afternoon session."}]}, {"title": "Go-live decision", "client": "MedicaCare Network", "provider": "ClearPath Digital", "project": "Patient portal rollout", "level": "C1", "duration": "15 min", "goal": "Evaluate readiness, risk and a phased delivery decision.", "turns": [{"speaker": "Program director - MedicaCare", "text": "Training is complete, but the accessibility review found two high-priority issues."}, {"speaker": "Delivery lead - ClearPath", "text": "We can fix the contrast issue today. The keyboard navigation change needs another test cycle."}, {"speaker": "Program director - MedicaCare", "text": "Then I recommend a limited launch for staff users only."}, {"speaker": "Delivery lead - ClearPath", "text": "Agreed. We will provide a revised plan and evidence for the public launch review."}]}]}, {"id": "fintech-pulse", "name": "PulsePay", "industry": "Finance & Fintech", "color": "#1769aa", "description": "Daily meetings for PulsePay's fraud, payments and reporting workstream.", "conversations": [{"title": "Fraud rule tuning", "client": "PulsePay", "provider": "BluePeak Analytics", "project": "Fraud detection upgrade", "level": "B2", "duration": "12 min", "goal": "Summarize model results and agree on a safe experiment.", "turns": [{"speaker": "Risk manager - PulsePay", "text": "The new rule reduced false positives yesterday, but it missed three high-risk transfers in testing."}, {"speaker": "Data scientist - BluePeak", "text": "The misses share a new merchant category. I will add it to the evaluation set."}, {"speaker": "Risk manager - PulsePay", "text": "Can we test the rule only on low-value transfers first?"}, {"speaker": "Data scientist - BluePeak", "text": "Yes. I will prepare a controlled rollout and define a rollback threshold."}]}, {"title": "Month-end reporting", "client": "PulsePay", "provider": "BluePeak Analytics", "project": "Finance reporting automation", "level": "B1", "duration": "10 min", "goal": "Report progress and communicate a reporting dependency.", "turns": [{"speaker": "Finance lead - PulsePay", "text": "The revenue dashboard is ready, but the settlement file arrived late again."}, {"speaker": "Engineer - BluePeak", "text": "I can add a freshness warning so users know when the figures are provisional."}, {"speaker": "Finance lead - PulsePay", "text": "That would help. Please make the warning visible in the executive view."}, {"speaker": "Engineer - BluePeak", "text": "I will deliver that change today and include it in tomorrow's review."}]}, {"title": "Payment incident review", "client": "PulsePay", "provider": "BluePeak Analytics", "project": "Payment reliability", "level": "C1", "duration": "15 min", "goal": "Lead a blameless incident update and agree on prevention work.", "turns": [{"speaker": "Incident lead - PulsePay", "text": "The outage lasted twenty-two minutes and affected card authorizations in Europe."}, {"speaker": "Platform lead - BluePeak", "text": "The failover completed, but the health check did not detect the dependency failure quickly enough."}, {"speaker": "Incident lead - PulsePay", "text": "What is the quickest way to reduce detection time?"}, {"speaker": "Platform lead - BluePeak", "text": "We will add a synthetic authorization test and review the alert with operations tomorrow."}]}]}, {"id": "travel-horizon", "name": "Horizon Travel Co.", "industry": "Travel & Tourism", "color": "#8b4f9f", "description": "Daily meetings for Horizon's booking and customer experience platform.", "conversations": [{"title": "Booking flow redesign", "client": "Horizon Travel Co.", "provider": "Wayfinder Studio", "project": "Booking experience redesign", "level": "B1", "duration": "10 min", "goal": "Share design progress and resolve a content dependency.", "turns": [{"speaker": "Product owner - Horizon", "text": "The new booking flow passed the mobile usability test. We still need the baggage copy."}, {"speaker": "Designer - Wayfinder", "text": "I can use temporary copy, but the final wording affects the layout."}, {"speaker": "Product owner - Horizon", "text": "Marketing will send the approved wording this afternoon."}, {"speaker": "Designer - Wayfinder", "text": "Great. I will keep the component flexible and update it when the copy arrives."}]}, {"title": "Flight disruption messages", "client": "Horizon Travel Co.", "provider": "Wayfinder Studio", "project": "Traveler communications", "level": "B2", "duration": "12 min", "goal": "Coordinate a customer-impacting feature and its acceptance criteria.", "turns": [{"speaker": "Operations lead - Horizon", "text": "We tested the delay message, but it does not explain the rebooking options clearly enough."}, {"speaker": "Content lead - Wayfinder", "text": "I will rewrite it with one primary action and a link to the full options."}, {"speaker": "Operations lead - Horizon", "text": "Please include the call-center fallback for passengers without the app."}, {"speaker": "Content lead - Wayfinder", "text": "Understood. I will add that path and send the revised version for approval."}]}, {"title": "Peak season readiness", "client": "Horizon Travel Co.", "provider": "Wayfinder Studio", "project": "Booking platform scale-up", "level": "C1", "duration": "15 min", "goal": "Discuss readiness, risk and ownership before a high-demand period.", "turns": [{"speaker": "Technology director - Horizon", "text": "Load testing is within target, but supplier response times are still inconsistent."}, {"speaker": "Engineering lead - Wayfinder", "text": "We can add a timeout and fallback response, although it will need a product decision."}, {"speaker": "Technology director - Horizon", "text": "Use the fallback for search, but do not hide failed bookings."}, {"speaker": "Engineering lead - Wayfinder", "text": "Agreed. We will document the distinction and run the final test tomorrow."}]}]}, {"id": "manufacturing-forge", "name": "ForgeWorks Manufacturing", "industry": "Manufacturing", "color": "#c47d16", "description": "Daily meetings for ForgeWorks' production data and maintenance program.", "conversations": [{"title": "Production data capture", "client": "ForgeWorks Manufacturing", "provider": "Axis Automation", "project": "Smart factory pilot", "level": "B1", "duration": "10 min", "goal": "Explain field progress and identify an on-site blocker.", "turns": [{"speaker": "Plant manager - ForgeWorks", "text": "The team installed sensors on line two, but the night shift has not been trained yet."}, {"speaker": "Automation engineer - Axis", "text": "I can run a short training session before the next shift starts."}, {"speaker": "Plant manager - ForgeWorks", "text": "Please focus on the alarm acknowledgement process."}, {"speaker": "Automation engineer - Axis", "text": "I will prepare examples using yesterday's production data."}]}, {"title": "Maintenance dashboard", "client": "ForgeWorks Manufacturing", "provider": "Axis Automation", "project": "Predictive maintenance", "level": "B2", "duration": "12 min", "goal": "Review a pilot result and agree on the next data requirement.", "turns": [{"speaker": "Reliability lead - ForgeWorks", "text": "The dashboard identified two pumps with unusual vibration patterns."}, {"speaker": "Data engineer - Axis", "text": "The model is useful, but we need confirmed maintenance outcomes to measure accuracy."}, {"speaker": "Reliability lead - ForgeWorks", "text": "The technicians can record the inspection result in the maintenance system."}, {"speaker": "Data engineer - Axis", "text": "Excellent. I will add that field to the pilot report and track it this week."}]}, {"title": "Factory rollout decision", "client": "ForgeWorks Manufacturing", "provider": "Axis Automation", "project": "Smart factory pilot", "level": "C1", "duration": "15 min", "goal": "Make a recommendation based on operational evidence and risk.", "turns": [{"speaker": "Operations director - ForgeWorks", "text": "The pilot reduced unplanned downtime, but the benefit varied between shifts."}, {"speaker": "Program lead - Axis", "text": "The variation is linked to inconsistent sensor checks at shift handover."}, {"speaker": "Operations director - ForgeWorks", "text": "Then a full rollout should include a handover checklist and supervisor training."}, {"speaker": "Program lead - Axis", "text": "I agree. We will update the business case with those conditions."}]}]}, {"id": "education-summit", "name": "Summit Learning Academy", "industry": "Education", "color": "#7157a8", "description": "Daily meetings for Summit's learning platform and teaching program.", "conversations": [{"title": "Teacher dashboard sprint", "client": "Summit Learning Academy", "provider": "BrightPath Labs", "project": "Learning analytics platform", "level": "B1", "duration": "10 min", "goal": "Give a clear sprint update and request feedback from the client.", "turns": [{"speaker": "Teacher representative - Summit", "text": "The attendance view is much easier to use. Teachers still need a weekly summary."}, {"speaker": "Product manager - BrightPath", "text": "We can add that to the next sprint. Which measures are most important?"}, {"speaker": "Teacher representative - Summit", "text": "Attendance, overdue work and students who need support."}, {"speaker": "Product manager - BrightPath", "text": "I will turn those into acceptance criteria and share them this afternoon."}]}, {"title": "Course content migration", "client": "Summit Learning Academy", "provider": "BrightPath Labs", "project": "Digital course migration", "level": "B2", "duration": "12 min", "goal": "Manage a content dependency and agree on a realistic sequence.", "turns": [{"speaker": "Content lead - Summit", "text": "We migrated the first module, but several videos do not have captions."}, {"speaker": "Delivery manager - BrightPath", "text": "That blocks accessibility approval. Can your team provide transcripts today?"}, {"speaker": "Content lead - Summit", "text": "Yes, for the first module. The remaining transcripts will arrive on Friday."}, {"speaker": "Delivery manager - BrightPath", "text": "Then we will approve module one separately and keep the rest in the migration queue."}]}, {"title": "Term launch readiness", "client": "Summit Learning Academy", "provider": "BrightPath Labs", "project": "Learning platform launch", "level": "C1", "duration": "15 min", "goal": "Evaluate launch risks and agree on a go-live decision.", "turns": [{"speaker": "Academic director - Summit", "text": "The platform is ready for staff, but the parent notification test is still outstanding."}, {"speaker": "Technical lead - BrightPath", "text": "The notification service is configured. We need final wording and consent confirmation."}, {"speaker": "Academic director - Summit", "text": "I will have the communications team review the wording by noon."}, {"speaker": "Technical lead - BrightPath", "text": "Once approved, we can complete the test and confirm the launch recommendation."}]}]}];let selectedBank=banks[0].id;const list=document.querySelector('#bank-list'),library=document.querySelector('#library'),search=document.querySelector('#search'),level=document.querySelector('#level'),summary=document.querySelector('#summary'),details=document.querySelector('#detail-backdrop');document.querySelector('#bank-count').textContent=banks.length;document.querySelector('#conversation-count').textContent=banks.reduce((total,bank)=>total+bank.conversations.length,0);
function renderBanks(){list.innerHTML=banks.map(bank=>`<button class="bank ${bank.id===selectedBank?'selected':''}" style="--bank-color:${bank.color}" data-bank="${bank.id}"><span class="bank-name">${bank.name}</span><span class="bank-meta">${bank.industry} &middot; ${bank.conversations.length} conversations</span></button>`).join('');list.querySelectorAll('.bank').forEach(button=>button.addEventListener('click',()=>{selectedBank=button.dataset.bank;renderBanks();renderLibrary()}))}
function renderLibrary(){const bank=banks.find(item=>item.id===selectedBank);const query=search.value.toLowerCase(),wantedLevel=level.value;const conversations=bank.conversations.filter(item=>(!query||`${item.title} ${item.client} ${item.provider} ${item.project} ${item.goal}`.toLowerCase().includes(query))&&(!wantedLevel||item.level===wantedLevel));library.innerHTML=conversations.map((item,index)=>`<button class="conversation" style="--bank-color:${bank.color}" data-index="${bank.conversations.indexOf(item)}"><div class="conversation-top"><span class="level">${item.level}</span><span class="duration">${item.duration}</span></div><h2>${item.title}</h2><p class="meeting-context">${item.client} &middot; ${item.provider}</p><p>${item.goal}</p><span class="goal">Open daily &rarr;</span></button>`).join('')||'<p>No daily meetings match these filters.</p>';summary.textContent=`${conversations.length} of ${bank.conversations.length} daily meetings`;library.querySelectorAll('.conversation').forEach(card=>card.addEventListener('click',()=>showDetails(bank,bank.conversations[Number(card.dataset.index)])))}
function showDetails(bank,conversation){document.querySelector('#detail-bank').textContent=bank.name;document.querySelector('#detail-title').textContent=conversation.title;document.querySelector('#detail-context').textContent=`Client: ${conversation.client} · Delivery team: ${conversation.provider} · Project: ${conversation.project}`;document.querySelector('#detail-goal').textContent=`${conversation.goal} ${conversation.level} · ${conversation.duration}`;document.querySelector('#turns').innerHTML=conversation.turns.map((turn,index)=>`<div class="turn" style="--turn-color:${index%2?'#1769aa':bank.color}"><span class="speaker">${turn.speaker}</span><span class="turn-text">${turn.text}</span></div>`).join('');details.classList.add('open')}
[search,level].forEach(control=>control.addEventListener('input',renderLibrary));document.querySelector('#detail-close').addEventListener('click',()=>details.classList.remove('open'));details.addEventListener('click',event=>{if(event.target===details)details.classList.remove('open')});renderBanks();renderLibrary();
</script></body></html>
